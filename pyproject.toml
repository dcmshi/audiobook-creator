[project]
name = "audiobook-creator"
version = "0.1.0"
description = "Turn PDFs and EPUBs into audiobooks (MP3/M4B) with local-first TTS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "numpy>=2.0",
    "kokoro-onnx>=0.4",
    "anthropic>=0.116",
]

[project.optional-dependencies]
pdf = ["docling>=2.0"]

[project.scripts]
abc = "audiobook_creator.cli:app"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audiobook_creator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docling: requires docling installed and a sample PDF (skipped by default)",
    "kokoro: requires kokoro model files under models/ (skipped by default)",
    "llm_live: hits the real Anthropic API (needs key; deselected by default)",
]
addopts = "-m 'not docling and not kokoro and not llm_live' --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned so a ruff upgrade cannot silently change what the gate enforces.
select = ["E4", "E7", "E9", "F", "B", "SIM", "I", "UP", "RUF", "BLE"]
# The en dash is intentional: real citation ranges look like "[7–9]".
allowed-confusables = ["–"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API requires these in argument defaults; they build inert metadata objects,
# not the mutable shared state B008 exists to catch.
extend-immutable-calls = ["typer.Argument", "typer.Option"]
